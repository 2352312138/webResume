<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="王如洋，7年工作经验，鸿蒙 / Android / HarmonyOS 客户端开发工程师个人简历与项目作品集。"
    />
    <title>王如洋 | 鸿蒙开发工程师</title>
    <script>
      (() => {
        document.documentElement.classList.add("app-booting");
        document.documentElement.classList.add("intro-scroll-lock");
        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = "manual";
        }
        window.scrollTo(0, 0);
      })();
    </script>
    <style>
      html.app-booting,
      html.app-booting body,
      html.intro-scroll-lock,
      html.intro-scroll-lock body {
        overflow: hidden;
        height: 100%;
      }

      html.app-booting #app {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
